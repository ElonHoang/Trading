name: Weekly history purge

# 01:37 UTC thu Hai = 08:37 gio Viet Nam, trung lich cua TradingLearningScheduler.
# Chi xoa keo DA DONG qua han giu du lieu; keo mo, model, cau hinh va learning
# log khong bi dung toi.
#
# LUU Y: GitHub tu tat scheduled workflow sau 60 ngay repo khong co commit moi.
on:
  schedule:
    - cron: "37 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Dung chung group `trading-state` voi daily-learning va telegram-alerts: ca ba deu
# ghi vao state trading, va khoa trong tien trinh khong bat qua duoc ranh gioi runner.
concurrency:
  group: trading-state
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        id: jar-cache
        with:
          path: server-java/target/dong-tien-ai.jar
          key: dong-tien-jar-${{ hashFiles('server-java/pom.xml', 'server-java/src/**', 'config/**', 'db/migrations/**', 'web/**', 'login/**', 'public/**', 'index.html') }}

      - uses: actions/setup-java@v4
        if: steps.jar-cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build jar
        if: steps.jar-cache.outputs.cache-hit != 'true'
        run: mvn -f server-java/pom.xml -DskipTests package

      - uses: actions/setup-java@v4
        if: steps.jar-cache.outputs.cache-hit == 'true'
        with:
          distribution: temurin
          java-version: 17

      - name: Purge expired closed trades
        env:
          JDBC_DATABASE_URL: ${{ secrets.JDBC_DATABASE_URL }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          TRADING_TIMEZONE: Asia/Ho_Chi_Minh
          TRADING_HISTORY_RETENTION_DAYS: "30"
          DATABASE_MIGRATE: "false"
        run: |
          test -n "$JDBC_DATABASE_URL" || { echo 'Missing JDBC_DATABASE_URL.'; exit 1; }
          java -jar server-java/target/dong-tien-ai.jar purge-history
