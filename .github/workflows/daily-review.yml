name: Daily loss review (database fallback, manual only)

on:
  workflow_dispatch:
    inputs:
      force:
        description: Bỏ qua cửa 24h
        type: boolean
        default: true
      yesterday:
        description: Rà ngày hôm qua thay vì ngày đang chạy
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-loss-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Review PostgreSQL trade history
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: ${{ secrets.DATABASE_SSL }}
          DATABASE_SSL_REJECT_UNAUTHORIZED: ${{ secrets.DATABASE_SSL_REJECT_UNAUTHORIZED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_IDS: ${{ secrets.TELEGRAM_ALERT_CHAT_IDS }}
        run: |
          test -n "$DATABASE_URL" || { echo 'Missing DATABASE_URL.'; exit 1; }
          npm run review:daily -- --telegram --no-write \
            ${{ inputs.force && '--force' || '' }} \
            ${{ inputs.yesterday && '--yesterday' || '' }}
