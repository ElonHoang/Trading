name: Daily loss review (database fallback, manual only)

on:
  workflow_dispatch:
    inputs:
      force:
        description: Bỏ qua cửa 24h
        type: boolean
        default: true
      yesterday:
        description: Rà ngày hôm qua thay vì ngày đang chạy
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-loss-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -f server-java/pom.xml -DskipTests package
      - name: Review PostgreSQL trade history
        env:
          JDBC_DATABASE_URL: ${{ secrets.JDBC_DATABASE_URL }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_IDS: ${{ secrets.TELEGRAM_ALERT_CHAT_IDS }}
        run: |
          test -n "$JDBC_DATABASE_URL" || { echo 'Missing JDBC_DATABASE_URL.'; exit 1; }
          java -jar server-java/target/dong-tien-ai.jar daily-review
