name: Daily learning job

# Thay cho cron cua bot worker khi deploy tren Render goi free (khong co worker).
# 01:07 UTC = 08:07 gio Viet Nam, trung lich cua TradingLearningScheduler.
#
# LUU Y: GitHub tu tat scheduled workflow sau 60 ngay repo khong co commit moi.
on:
  schedule:
    - cron: "7 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Ba workflow (learning, purge, alerts) dung chung group vi cung doc-sua-ghi state
# auto-retune/monitor trong TiDB. Chung chay o ba runner khac nhau nen TradingStateLock
# khong bao ve duoc; concurrency cua GitHub la co che noi tiep duy nhat o day.
concurrency:
  group: trading-state
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        id: jar-cache
        with:
          path: server-java/target/dong-tien-ai.jar
          key: dong-tien-jar-${{ hashFiles('server-java/pom.xml', 'server-java/src/**', 'config/**', 'db/migrations/**', 'web/**', 'login/**', 'public/**', 'index.html') }}

      - uses: actions/setup-java@v4
        if: steps.jar-cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build jar
        if: steps.jar-cache.outputs.cache-hit != 'true'
        run: mvn -f server-java/pom.xml -DskipTests package

      - uses: actions/setup-java@v4
        if: steps.jar-cache.outputs.cache-hit == 'true'
        with:
          distribution: temurin
          java-version: 17

      - name: Run daily learning against TiDB Cloud
        env:
          JDBC_DATABASE_URL: ${{ secrets.JDBC_DATABASE_URL }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRADING_TIMEZONE: Asia/Ho_Chi_Minh
          # Web service da chay Flyway; job nay chi doc schema da co.
          DATABASE_MIGRATE: "false"
        run: |
          test -n "$JDBC_DATABASE_URL" || { echo 'Missing JDBC_DATABASE_URL.'; exit 1; }
          java -jar server-java/target/dong-tien-ai.jar learn-once
