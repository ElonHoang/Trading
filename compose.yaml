services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trading}
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading} -d ${POSTGRES_DB:-trading}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      migrate-db:
        condition: service_completed_successfully
    environment:
      PORT: 8080
      JDBC_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-trading}
      DATABASE_USER: ${POSTGRES_USER:-trading}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      TRADING_TIMEZONE: ${TRADING_TIMEZONE:-Asia/Bangkok}
    ports:
      - "${WEB_PORT:-8080}:8080"
    networks: [backend]

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles: [bot]
    depends_on:
      migrate-db:
        condition: service_completed_successfully
    command: ["java", "-jar", "/app/app.jar", "bot"]
    environment:
      JDBC_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-trading}
      DATABASE_USER: ${POSTGRES_USER:-trading}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_OWNER_IDS: ${TELEGRAM_OWNER_IDS:-}
      TELEGRAM_ALLOWED_IDS: ${TELEGRAM_ALLOWED_IDS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEFAULT_INTERVAL: ${DEFAULT_INTERVAL:-4h}
    networks: [backend]

  import-files:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: [tools]
    depends_on:
      migrate-db:
        condition: service_completed_successfully
    command: ["java", "-jar", "/app/app.jar", "import-files", "--overwrite"]
    environment:
      JDBC_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-trading}
      DATABASE_USER: ${POSTGRES_USER:-trading}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
    networks: [backend]

  migrate-db:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["java", "-jar", "/app/app.jar", "migrate"]
    environment:
      JDBC_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-trading}
      DATABASE_USER: ${POSTGRES_USER:-trading}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
    networks: [backend]

volumes:
  postgres-data:

networks:
  backend:
    driver: bridge
