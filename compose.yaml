services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      migrate-db:
        condition: service_completed_successfully
    environment:
      PORT: 8080
      JDBC_DATABASE_URL: ${JDBC_DATABASE_URL:?Set JDBC_DATABASE_URL to the TiDB Cloud JDBC SSL URL in .env}
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER to the TiDB Cloud user in .env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_LIFETIME_MS: ${DATABASE_MAX_LIFETIME_MS:-300000}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TRADING_TIMEZONE: ${TRADING_TIMEZONE:-Asia/Bangkok}
    ports:
      - "${WEB_PORT:-8080}:8080"
    networks: [backend]

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles: [bot]
    depends_on:
      migrate-db:
        condition: service_completed_successfully
    command: ["java", "-jar", "/app/app.jar", "bot"]
    environment:
      JDBC_DATABASE_URL: ${JDBC_DATABASE_URL:?Set JDBC_DATABASE_URL to the TiDB Cloud JDBC SSL URL in .env}
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER to the TiDB Cloud user in .env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_LIFETIME_MS: ${DATABASE_MAX_LIFETIME_MS:-300000}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_OWNER_IDS: ${TELEGRAM_OWNER_IDS:-}
      TELEGRAM_ALLOWED_IDS: ${TELEGRAM_ALLOWED_IDS:-}
      TELEGRAM_ALERT_CHAT_IDS: ${TELEGRAM_ALERT_CHAT_IDS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEFAULT_INTERVAL: ${DEFAULT_INTERVAL:-4h}
    networks: [backend]

  import-files:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: [tools]
    depends_on:
      migrate-db:
        condition: service_completed_successfully
    command: ["java", "-jar", "/app/app.jar", "import-files", "--overwrite"]
    environment:
      JDBC_DATABASE_URL: ${JDBC_DATABASE_URL:?Set JDBC_DATABASE_URL to the TiDB Cloud JDBC SSL URL in .env}
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER to the TiDB Cloud user in .env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      DATABASE_MAX_LIFETIME_MS: ${DATABASE_MAX_LIFETIME_MS:-300000}
    networks: [backend]

  migrate-db:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    command: ["java", "-jar", "/app/app.jar", "migrate"]
    environment:
      JDBC_DATABASE_URL: ${JDBC_DATABASE_URL:?Set JDBC_DATABASE_URL to the TiDB Cloud JDBC SSL URL in .env}
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER to the TiDB Cloud user in .env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      DATABASE_MAX_LIFETIME_MS: ${DATABASE_MAX_LIFETIME_MS:-300000}
    networks: [backend]

networks:
  backend:
    driver: bridge
