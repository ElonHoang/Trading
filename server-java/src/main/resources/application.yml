spring:
  application:
    name: dong-tien-auth-server
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:server-java/.env[.properties]

server:
  port: ${JAVA_SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 7d
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

logging:
  level:
    org.springframework.security: INFO
