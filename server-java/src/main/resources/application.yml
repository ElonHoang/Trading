spring:
  application:
    name: dong-tien-ai
  datasource:
    # Paste the JDBC string shown by TiDB Cloud's Connect dialog into JDBC_DATABASE_URL.
    # TiDB Cloud Starter requires TLS; the local default is only for TiDB self-managed.
    url: ${JDBC_DATABASE_URL:jdbc:mysql://localhost:4000/trading?useSSL=false&connectionTimeZone=UTC}
    username: ${DATABASE_USER:root}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
      minimum-idle: 0
      connection-timeout: 10000
      # TiDB Cloud may close public connections during maintenance; recycle first.
      max-lifetime: ${DATABASE_MAX_LIFETIME_MS:300000}
  flyway:
    enabled: ${DATABASE_MIGRATE:true}
    locations: classpath:db/migration
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:server-java/.env[.properties]

server:
  port: ${JAVA_SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:8h}
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}

logging:
  level:
    org.springframework.security: INFO

dongtien:
  telegram:
    token: ${TELEGRAM_BOT_TOKEN:}
    allowed-ids: ${TELEGRAM_ALLOWED_IDS:}
    # Mutating Telegram commands fail closed until explicit owner IDs are configured.
    owner-ids: ${TELEGRAM_OWNER_IDS:}
    alert-chat-ids: ${TELEGRAM_ALERT_CHAT_IDS:}
    polling-enabled: ${TELEGRAM_POLLING_ENABLED:false}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-sonnet-4-20250514}
  learning:
    scheduler:
      # This remains off unless the persistent bot worker explicitly enables it.
      enabled: ${TRADING_LEARNING_SCHEDULER_ENABLED:false}
      zone: ${TRADING_TIMEZONE:Asia/Ho_Chi_Minh}
      daily-cron: ${TRADING_DAILY_LEARNING_CRON:0 7 8 * * *}
      weekly-purge-cron: ${TRADING_WEEKLY_HISTORY_PURGE_CRON:0 37 8 * * MON}
      history-retention-days: ${TRADING_HISTORY_RETENTION_DAYS:30}
      max-model-pairs: ${TRADING_DAILY_MODEL_MAX_PAIRS:3}
      model-training-enabled: ${TRADING_DAILY_MODEL_TRAINING_ENABLED:true}
