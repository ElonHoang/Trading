spring:
  application:
    name: dong-tien-ai
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/trading}
    username: ${DATABASE_USER:trading}
    password: ${DATABASE_PASSWORD:change-me}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      minimum-idle: 1
      connection-timeout: 10000
  flyway:
    enabled: ${DATABASE_MIGRATE:true}
    locations: classpath:db/migration
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:server-java/.env[.properties]

server:
  port: ${JAVA_SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 7d
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

logging:
  level:
    org.springframework.security: INFO

dongtien:
  telegram:
    token: ${TELEGRAM_BOT_TOKEN:}
    allowed-ids: ${TELEGRAM_ALLOWED_IDS:}
    alert-chat-ids: ${TELEGRAM_ALERT_CHAT_IDS:}
    polling-enabled: ${TELEGRAM_POLLING_ENABLED:false}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-sonnet-4-20250514}
